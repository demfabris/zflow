[package]
name = "zz-gpui-tray"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
rust-version.workspace = true
description = "A tray or menu bar icon with a menu, for zz-gpui apps: StatusNotifierItem, NSStatusItem and Shell_NotifyIcon"
publish = false

[dependencies]
async-channel.workspace = true
image = { workspace = true, features = ["png"] }
log.workspace = true
parking_lot.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSButton", "NSCell", "NSControl", "NSEvent", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "objc2-core-foundation"] }
objc2-foundation = { workspace = true, features = ["NSData", "NSGeometry", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
