version = 1

[daemon]
state_dir = "/var/lib/zflow"
control_socket = "/run/zflow/zflowd.sock"

[input]
capture_devices = []
activation_chord = ["KEY_LEFTCTRL", "KEY_LEFTMETA", "KEY_F12"]
escape_chord = ["KEY_LEFTCTRL", "KEY_LEFTMETA", "KEY_BACKSPACE"]
allow_prelogin_input = false

[transport]
listen = "[::]:43119"
checkpoint_ms = 250
lease_ms = 900
discovery = true

[playout]
mode = "adaptive"
fixed_delay_ms = 8
minimum_delay_ms = 3
maximum_delay_ms = 35
percentile = 0.8

[peers]
