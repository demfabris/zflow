name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the Cargo.toml version after all builds pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: 1.97.1
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: macos-26-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'The tag must match Cargo.toml' >&2
            exit 1
          fi
      - name: Install Rust build toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Check installer
        run: python3 tests/install_test.py
      - name: Linux checks and binaries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          node tests/gnome_desktop_test.mjs
          node tests/gnome_panel_test.mjs
          cargo build --locked --release --bin zflow --bin zflowd
          ./scripts/build-deb.sh
          ./tests/deb_lifecycle.sh
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          : "${MACOS_CERTIFICATE_BASE64:?Missing MACOS_CERTIFICATE_BASE64}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Missing MACOS_CERTIFICATE_PASSWORD}"
          : "${MACOS_SIGNING_IDENTITY:?Missing MACOS_SIGNING_IDENTITY}"
          umask 077
          certificate="$RUNNER_TEMP/zflow-signing.p12"
          keychain="$RUNNER_TEMP/zflow-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          rm -f "$certificate"
      - name: Native macOS app and bridge tests
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          ./scripts/build-macos-app.sh --sign "$MACOS_SIGNING_IDENTITY"
          ZFLOW_RUST_LIB_DIR="$PWD/target/release" swift test --package-path macos
          python3 tests/macos_notarization_test.py
      - name: Notarize macOS app
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${APPLE_ID:?Missing APPLE_ID}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing APPLE_APP_SPECIFIC_PASSWORD}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          keychain="$RUNNER_TEMP/zflow-signing.keychain-db"
          xcrun notarytool store-credentials zflow-ci --keychain "$keychain" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID"
          ./scripts/notarize-macos-app.sh zflow-ci "$keychain"
      - name: Assemble release archive
        env:
          TARGET: ${{ matrix.target }}
        run: ./scripts/package-release.sh "$TARGET"
      - name: Verify notarized macOS archive
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          check_dir=$(mktemp -d "$RUNNER_TEMP/zflow-archive.XXXXXXXX")
          trap 'rm -rf -- "$check_dir"' EXIT
          tar -xzf target/dist/zflow-v*-"$TARGET".tar.gz --strip-components=1 -C "$check_dir"
          codesign --verify --strict --deep "$check_dir/zflow.app"
          xcrun stapler validate "$check_dir/zflow.app"
          spctl --assess --type execute --verbose=2 "$check_dir/zflow.app"
      - name: Remove macOS signing credentials
        if: always() && runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/zflow-signing.keychain-db"
          status=0
          rm -f "$RUNNER_TEMP/zflow-signing.p12" || status=$?
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain" || status=$?; fi
          exit "$status"
      - name: Preserve notarization results
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notarization-${{ matrix.target }}
          path: target/notarization/*.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified artifacts
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: target/dist
          pattern: release-*
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          tag="v$version"
          # Never overwrite an existing release, including an incomplete draft.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; inspect it before retrying." >&2
            exit 1
          fi
          if [[ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]]; then
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            if [[ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]]; then
              echo 'Existing release tag does not point to the built commit.' >&2
              exit 1
            fi
          fi
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            test -s "target/dist/zflow-$tag-$target.tar.gz"
          done
          test -s "target/dist/zflow_${version}_amd64.deb"
          test -s "target/dist/zflow_${version}_arm64.deb"
          cp install.sh target/dist/install.sh
          (cd target/dist && sha256sum ./*.tar.gz ./*.deb install.sh | sed 's|  ./|  |' > SHA256SUMS)
          prerelease=()
          if [[ "$version" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$tag" target/dist/* --target "$GITHUB_SHA" --draft \
            --title "zflow $tag" --notes-file packaging/RELEASE_NOTES.md "${prerelease[@]}"
          gh release edit "$tag" --draft=false
