[package]
name = "zflow-kvm"
version = "0.7.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Low-latency, loss-resilient input sharing for Linux, macOS and Windows"
repository = "https://github.com/demfabris/zflow"
rust-version = "1.97"

[lib]
name = "zflow"
path = "src/lib.rs"

[[bin]]
name = "zflow"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
getrandom = { version = "0.3", features = ["std"] }
hmac = "0.12"
if-addrs = "0.15.0"
libc = "0.2"
mdns-sd = { version = "0.21.1", default-features = false, features = ["async"] }
postcard = { version = "1.1", features = ["alloc"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.4"
toml_edit = { version = "0.25", features = ["serde"] }
zstd = { version = "0.13", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
cc = "1.4"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.10"
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "tokio"] }
evdev = "0.13.2"
mio = { version = "1.2.2", default-features = false, features = ["os-ext", "os-poll"] }
nix = { version = "0.30", features = ["socket", "user"] }
sd-notify = "0.5.0"
semver = "1.0"

[patch.crates-io]
evdev = { git = "https://github.com/cmr/evdev", rev = "7fee138a341f73b81b9c4f8c59e3527c6a169ea3" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.23"
# Paused time for handoff server tests.
tokio = { version = "1.53.1", features = ["test-util"] }

[profile.release]
lto = "thin"
strip = "symbols"

# macOS 27 rejects malformed proc-macro dylibs produced by Rust's stripping pass.
# https://github.com/rust-lang/rust/issues/157750
[profile.release.build-override]
strip = "none"

[workspace]
members = [".", "crates/*"]
# zflow's own crates and the kit it adds to; the rest of zz-gpui is vendored
# as is and tested in zz.
default-members = [".", "crates/zflow-app", "crates/zz-gpui-kit", "crates/zz-gpui-tray"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.97"
version = "0.7.0"

# The zz-gpui stack, vendored from github.com/demfabris/zz (see crates/README.md).
[workspace.dependencies]
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_macos = "0.26.0"
accesskit_unix = "0.22"
accesskit_windows = "0.34"
anyhow = "1.0.86"
ashpd = { version = "0.13", default-features = false, features = [
    "async-io",
    "inhibit",
    "notification",
    "open_uri",
    "file_chooser",
    "settings",
    "trash"
] }
async-channel = "2.5.0"
async-task = "4.7"
backtrace = "0.3"
bitflags = "2.6.0"
block2 = "0.6.2"
bytes = "1.0"
cbindgen = { version = "0.28.0", default-features = false }
chrono = { version = "0.4.45", default-features = false }
cocoa = "=0.26.0"
console_error_panic_hook = "0.1.7"
core-foundation = "=0.10.1"
core-foundation-sys = "0.8.6"
core-graphics = "0.24"
core-text = "21"
core-video = "=0.5.2"
criterion = { version = "0.5", features = ["html_reports"] }
ctor = "1.0.12"
derive_more = { version = "2.1.1", features = [
    "add",
    "add_assign",
    "deref",
    "deref_mut",
    "display",
    "from",
    "from_str",
    "mul",
    "mul_assign",
    "not",
] }
dunce = "1.0"
env_logger = "0.11.11"
etagere = "0.2"
flume = "0.12"
foreign-types = "0.5"
futures = "0.3.34"
futures-concurrency = "7.7.1"
hdrhistogram = { version = "7", default-features = false }
heapless = "0.9.2"
heck = "0.5"
http = "1.1"
http-body = "1.0"
image = { version = "=0.25.10", default-features = false }
indexmap = { version = "2.7.0", features = ["serde"] }
inventory = "0.3.19"
itertools = "0.14.0"
js-sys = "0.3"
libc = "0.2.189"
log = "0.4.34"
mach2 = "0.5"
metal = "0.33"
notify-rust = "4"
objc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSOpenPanel", "NSPanel", "NSResponder", "NSRunningApplication", "NSSavePanel", "NSView", "NSWindow"] }
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-user-notifications = "0.3"
parking_lot = "0.12.5"
pathfinder_geometry = "0.5"
pollster = "1.0.1"
postage = { version = "0.5", features = ["futures-traits"] }
proc-macro2 = "1.0.93"
profiling = "1"
proptest = { git = "https://github.com/proptest-rs/proptest", rev = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b", features = ["attr-macro"] }
quote = "1.0.9"
rand = "0.9"
raw-window-handle = "0.6.2"
rayon = "1.8"
regex = "1.13.1"
resvg = { version = "0.46.0", default-features = false, features = [
    "text",
    "system-fonts",
    "memmap-fonts",
    "raster-images",
] }
rustc-hash = "2.1.0"
schemars = { version = "1.0", features = ["indexmap2"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7"
slotmap = "1.0.6"
smallvec = { version = "=1.16.1", features = ["serde"] }
smol = "=2.0.2"
stacksafe = "1.0"
strum = { version = "0.28", features = ["derive"] }
swash = "0.2.6"
syn = { version = "2.0.101", features = ["full", "extra-traits", "visit-mut"] }
thiserror = "2.0.20"
unicode-bidi = { version = "0.3.18", default-features = false, features = [
    "hardcoded-data",
] }
unicode-segmentation = "1.10"
url = "=2.5.8"
usvg = { version = "0.46.0", default-features = false }
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }
wasm-bindgen = "0.2.120"
wasm-bindgen-futures = "0.4"
web-time = "1.1.0"
wgpu = "=30.0.1"
which = "8"
windows = "=0.62.2"
windows-core = "0.62"
windows-registry = "0.6.0"

zz-gpui = { path = "crates/zz-gpui", default-features = false }
zz-gpui-kit = { path = "crates/zz-gpui-kit" }
zz-gpui-macros = { path = "crates/zz-gpui-macros" }
zz-gpui-platform = { path = "crates/zz-gpui-platform", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
wildcard_imports = "allow"
enum_glob_use = "allow"
struct_field_names = "allow"
items_after_statements = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
result_large_err = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
struct_excessive_bools = "allow"
type_complexity = "allow"
used_underscore_binding = "allow"
unused_self = "allow"

[profile.dev]
debug = 1

# The UI stack is slow unoptimized. "*" reaches only crates outside the
# workspace, so the vendored ones are named.
[profile.dev.package]
"*" = { opt-level = 2 }
taffy = { opt-level = 3 }
zz-gpui = { opt-level = 3 }
zz-gpui-macros = { opt-level = 2 }
zz-gpui-platform = { opt-level = 2 }
